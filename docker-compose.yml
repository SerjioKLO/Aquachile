services:
  # =============================================================================
  # 1. BASE DE DATOS: MySQL 8.0 con persistencia en volumen
  # =============================================================================
  db:
    image: mysql:8.0
    container_name: aquachile_mysql
    restart: always
    environment:
      MYSQL_DATABASE: aquachile_db
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - aquachile_net

  # =============================================================================
  # 2. BACKEND: Spring Boot 3/4 + Java 21 + JPA/Hibernate
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquachile_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: aquachile_db
      DB_USER: root
      DB_PASSWORD: root123
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - aquachile_net

volumes:
  mysql_data:
    driver: local

networks:
  aquachile_net:
    driver: bridge
